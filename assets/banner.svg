<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Dynamic pulsing and path animation */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -80; }
    }
    @keyframes ping {
      0% { r: 4px; opacity: 1; }
      100% { r: 24px; opacity: 0; }
    }

    .pulse-bg { transform-origin: center; animation: pulse-glow 6s ease-in-out infinite; }
    .route-line { stroke-dasharray: 8 8; animation: dash 3s linear infinite; }
    .ping-circle { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Glowing Background Ring -->
  <circle cx="980" cy="160" r="140" fill="url(#glow)" class="pulse-bg"/>

  <!-- Map Grid Graphic Lines (Background Dynamic Element) -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="800" y1="40" x2="1160" y2="40"/>
    <line x1="800" y1="120" x2="1160" y2="120"/>
    <line x1="800" y1="200" x2="1160" y2="200"/>
    <line x1="800" y1="280" x2="1160" y2="280"/>
    <line x1="840" y1="20" x2="840" y2="300"/>
    <line x1="920" y1="20" x2="920" y2="300"/>
    <line x1="1000" y1="20" x2="1000" y2="300"/>
    <line x1="1080" y1="20" x2="1080" y2="300"/>
  </g>

  <!-- Animated Navigation Route Line -->
  <path d="M 840 240 Q 920 180 920 120 T 1080 80" fill="none" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 840 240 Q 920 180 920 120 T 1080 80" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" class="route-line"/>

  <!-- Route Waypoints with Ripple Animation -->
  <g transform="translate(840, 240)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8" class="ping-circle"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
  </g>

  <g transform="translate(920, 120)">
    <circle cx="0" cy="0" r="4" fill="#818cf8" class="ping-circle" style="animation-delay: 0.6s;"/>
    <circle cx="0" cy="0" r="6" fill="#818cf8"/>
  </g>

  <!-- Destination Pin -->
  <g transform="translate(1080, 80)">
    <circle cx="0" cy="0" r="8" fill="#c084fc" class="ping-circle" style="animation-delay: 1.2s;"/>
    <path d="M 0 -18 C -7 -18 -12 -13 -12 -6 C -12 4 0 14 0 14 C 0 14 12 4 12 -6 C 12 -13 7 -18 0 -18 Z" fill="#c084fc"/>
    <circle cx="0" cy="-6" r="4" fill="#0f172a"/>
  </g>

  <!-- Foreground Text Content (Safely isolated on left side) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Badge -->
    <rect x="0" y="55" width="230" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="76" class="badge-text">🗺️ AWESOME MAPPING</text>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="145" class="title">Awesome Mapping &amp; Navigation</text>
    <rect x="0" y="162" width="580" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="205" class="subtitle">Curated Turn-by-Turn Navigation, Geocoding, &amp; GIS Libraries</text>
    <text x="0" y="235" class="subtitle" font-size="16px" fill="#64748b">Open-Source Developer Engines • Interactive Maps • Spatial Services</text>
  </g>
</svg>
